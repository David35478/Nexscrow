# nexscrow - Agent Escrow configuration.
# All safety rules and integration settings live here.

# Demo mode: fully simulated payments, no real money moves.
demo_mode: true

# NEAR Intents 1Click payment layer (used when demo_mode is false)
intents:
  api_url: https://1click.chaindefuser.com
  quote_path: /v0/quote
  tokens_path: /v0/tokens
  settle_asset_id: nusdc.token.a0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
  quote_deadline_seconds: 3600
  # Real escrow account (deposits settle here; payouts originate from it)
  escrow_account: yurrri.near

# NEAR Intents Agent API (experimental mainnet beta; optional).
# Activates when NEAR_INTENTS_AGENT_API_KEY is set; falls back to the
# agent_profiles policies above otherwise. The key is read-only for agent
# state — policy changes need the owner's signature, payouts need a grant.
agent_api:
  url: https://api.agentsonintents.com

# Security & constraints
kill_switch: false
max_job_reward_usd: 25.0
max_daily_payout_usd: 500.0
allowed_agents:
  - agent-oracle-1
  - agent-scribe-2
  - agent-quant-3

# Agent marketplace profiles - what each agent does, shown to customers.
agent_profiles:
  agent-oracle-1:
    display_name: Oracle
    tagline: Deep-research analyst
    specialization: Research
    verified: true
    skills:
      - market research
      - competitor analysis
      - ecosystem mapping
      - report writing
      - adoption analysis
    description: >
      Oracle turns a one-line brief into a structured research report:
      executive summary, key findings with evidence, method, risks and a
      conclusion. Best for market landscapes, adoption analysis and
      competitor scans.
    capabilities:
      - Structured research reports
      - Market and adoption analysis
      - Risk and caveat assessment
      - NEAR Intents ecosystem expertise
    delivers_in: "~1 minute"
    policy:
      max_txn_usd: 25.0
      payout_destinations: [escrow only]
      emergency_freeze: false
  agent-scribe-2:
    display_name: Scribe
    tagline: Precision technical writer
    specialization: Writing
    verified: true
    skills:
      - technical writing
      - explainers
      - editing
      - documentation
      - summaries
    description: >
      Scribe writes tight, well-sourced documents - summaries, explainers
      and reviews - with clean structure and honest limitations. Best when
      the deliverable must be readable by humans and auditable by machines.
    capabilities:
      - Technical summaries and explainers
      - Model and framework reviews
      - Editorial structuring
      - Escrow and payment-flow writing
    delivers_in: "~1 minute"
    policy:
      max_txn_usd: 25.0
      payout_destinations: [escrow only]
      emergency_freeze: false
  agent-quant-3:
    display_name: Quant
    tagline: Data & metrics analyst
    specialization: Data analysis
    verified: false
    skills:
      - data analysis
      - metrics dashboards
      - transaction activity
      - benchmarking
      - statistics
    description: >
      Quant digs into numbers: transaction activity, adoption metrics and
      benchmark comparisons, delivered as a tight analytical summary with
      the caveats stated up front. Best when the job needs figures, not prose.
    capabilities:
      - Data and metrics analysis
      - Activity and adoption benchmarks
      - Statistical summaries
    delivers_in: "~1 minute"
    policy:
      max_txn_usd: 10.0
      payout_destinations: [escrow only]
      emergency_freeze: false
min_proof_length: 200
protocol_fee_percent: 2.0
job_timeout_minutes: 60
default_dispute_window_minutes: 30

# Work engine: "near_ai" (cloud inference) or "demo" (deterministic template).
# Without NEAR_AI_API_KEY, or if the API call fails, the template is used.
work_engine: near_ai
near_ai:
  api_url: https://api.near.ai/v1/chat/completions
  model: gpt-4o-mini
  timeout_seconds: 30

# Auth: Google OAuth (set GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET env vars)
# and NEAR wallet connect (NEP-413 challenge). Demo login is always available.
auth:
  near_network: mainnet
  near_sign_in_contract: intents.near
