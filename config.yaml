# nexscrow - Agent Escrow configuration.
# All safety rules and integration settings live here.

# Simulation is per-session: only users who click "demo mode" get simulated
# funds; everyone else runs the live escrow flow. (Global killswitch for
# local development; the product default is live.)
demo_mode: false

# NEAR network. Development defaults to testnet. In production (APP_ENV=
# production) on-chain operations stay disabled until NEAR_NETWORK is set
# explicitly. Only testnet is registered in src/network.py; mainnet needs an
# audited release that adds it there. RPC: https://rpc.testnet.near.org
near:
  network: testnet

# NEAR escrow (real testnet transfers, per docs.near.org). There is no escrow
# smart contract: the escrow is a .testnet account you control.
# Deposits: the client's wallet signs a Transfer to the escrow account; the
# backend verifies the tx via testnet RPC before locking escrow.
# Payouts/refunds: the escrow account signs with ESCROW_PRIVATE_KEY (env).
# Set NEXSCROW_ESCROW_ACCOUNT (e.g. nexscrow-escrow.testnet) to override.
escrow:
  account: ""
  # NEAR/USD spot price used to size deposits (CoinGecko, no key required)
  price_url: https://api.coingecko.com/api/v3/simple/price
  price_ttl_seconds: 60

# NEAR Intents Agent API (mainnet beta, no testnet deployment). Disabled while
# testnet is active; agent_profiles policies below are used instead.
agent_api:
  url: https://api.agentsonintents.com

# Security & constraints
kill_switch: false
max_job_reward_usd: 25.0
max_daily_payout_usd: 500.0
allowed_agents:
  - agent-oracle-1
  - agent-scribe-2
  - agent-quant-3

# Agent marketplace profiles - what each agent does, shown to customers.
agent_profiles:
  agent-oracle-1:
    credit_cost: 10
    pricing:
      task_price_usd: 0.10
    display_name: Oracle
    tagline: Deep-research analyst
    specialization: Research
    verified: true
    skills:
      - market research
      - competitor analysis
      - ecosystem mapping
      - report writing
      - adoption analysis
    description: >
      Oracle turns a one-line brief into a structured research report:
      executive summary, key findings with evidence, method, risks and a
      conclusion. Best for market landscapes, adoption analysis and
      competitor scans.
    capabilities:
      - Structured research reports
      - Market and adoption analysis
      - Risk and caveat assessment
      - NEAR Intents ecosystem expertise
    delivers_in: "~1 minute"
    # NEAR account the escrow payout is sent to (the agent operator's wallet)
    payout_account: ""  # .testnet account; or NEXSCROW_AGENT_PAYOUT_ACCOUNT
    policy:
      max_txn_usd: 25.0
      payout_destinations: [escrow only]
      emergency_freeze: false
  agent-scribe-2:
    credit_cost: 10
    pricing:
      task_price_usd: 0.10
    display_name: Scribe
    tagline: Precision technical writer
    specialization: Writing
    verified: true
    skills:
      - technical writing
      - explainers
      - editing
      - documentation
      - summaries
    description: >
      Scribe writes tight, well-sourced documents - summaries, explainers
      and reviews - with clean structure and honest limitations. Best when
      the deliverable must be readable by humans and auditable by machines.
    capabilities:
      - Technical summaries and explainers
      - Model and framework reviews
      - Editorial structuring
      - Escrow and payment-flow writing
    delivers_in: "~1 minute"
    # NEAR account the escrow payout is sent to (the agent operator's wallet)
    payout_account: ""  # .testnet account; or NEXSCROW_AGENT_PAYOUT_ACCOUNT
    policy:
      max_txn_usd: 25.0
      payout_destinations: [escrow only]
      emergency_freeze: false
  agent-quant-3:
    credit_cost: 10
    pricing:
      task_price_usd: 0.10
    display_name: Quant
    tagline: Data & metrics analyst
    specialization: Data analysis
    verified: false
    skills:
      - data analysis
      - metrics dashboards
      - transaction activity
      - benchmarking
      - statistics
    description: >
      Quant digs into numbers: transaction activity, adoption metrics and
      benchmark comparisons, delivered as a tight analytical summary with
      the caveats stated up front. Best when the job needs figures, not prose.
    capabilities:
      - Data and metrics analysis
      - Activity and adoption benchmarks
      - Statistical summaries
    delivers_in: "~1 minute"
    # NEAR account the escrow payout is sent to (the agent operator's wallet)
    payout_account: ""  # .testnet account; or NEXSCROW_AGENT_PAYOUT_ACCOUNT
    policy:
      max_txn_usd: 10.0
      payout_destinations: [escrow only]
      emergency_freeze: false
min_proof_length: 200
protocol_fee_percent: 2.0
job_timeout_minutes: 60
default_dispute_window_minutes: 30

# Work engine: "near_ai" (cloud inference) or "demo" (deterministic template).
# Without NEAR_AI_API_KEY, or if the API call fails, the template is used.
work_engine: near_ai
near_ai:
  api_url: https://api.near.ai/v1/chat/completions
  model: gpt-4o-mini
  timeout_seconds: 30

# Auth: Google OAuth (set GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET env vars)
# and NEAR wallet connect (NEP-413 challenge).
auth:
  near_network: testnet
  # Unused by the testnet wallet flow (sign-in recipient is the site host).
  near_sign_in_contract: null

# NEAR Auth (fast-auth): Google login -> MPC-derived NEAR account.
# Testnet only, using the shared demo client ID (override NEAR_AUTH_CLIENT_ID).
near_auth:
  network: testnet
  client_id: np8paqIpMWmNbzT4xAvOOapZBjsOpptl

# Third-party listings remain disabled until credentials, model-level commercial
# permission, pricing, and treasury payout configuration have been reviewed.
providers:
  wiro:
    kind: wiro
    enabled: false
    api_key_env: WIRO_API_KEY
    api_secret_env: WIRO_API_SECRET
    timeout_seconds: 20
    agents: []
  custom:
    kind: custom
    enabled: false
    api_key_env: CUSTOM_AGENT_API_KEY
    timeout_seconds: 20
    agents: []
  near_agent_market:
    kind: near_agent_market
    enabled: false
    agents: []

# Separate from NEAR escrow. Enable only after deployment verification.
billing:
  enabled: false
  slippage_bps: 100
  max_price_age_seconds: 600
  plans:
    - {id: free, name: Free, price_usd: '0.00', credits: 20, period_days: 30, rollover: false, allowed_agents: ['*']}
    - {id: starter, name: Starter, price_usd: '9.00', credits: 500, period_days: 30, rollover: false, allowed_agents: ['*']}
    - {id: pro, name: Pro, price_usd: '29.00', credits: 2000, period_days: 30, rollover: false, allowed_agents: ['*']}
    - {id: business, name: Business, price_usd: '79.00', credits: 7000, period_days: 30, rollover: false, allowed_agents: ['*']}
  topup_packages:
    - {id: small, price_usd: '5.00', credits: 250}
    - {id: medium, price_usd: '15.00', credits: 1000}
    - {id: large, price_usd: '40.00', credits: 3000}
